name: Voidbind
options:
  bundleIdPrefix: one.rarebit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No code signing needed for a Simulator build; a real device build sets a team.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  Voidbind:
    type: application
    platform: iOS
    sources:
      - path: Voidbind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.rarebit.voidbind
        # The KMP framework's module is also 'Voidbind'; give the app a distinct
        # Swift module name so `import Voidbind` resolves to the framework, not itself.
        PRODUCT_MODULE_NAME: VoidbindApp
        INFOPLIST_FILE: Voidbind/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      # Built by `./gradlew assembleVoidbindDebugXCFramework` (see preBuildScripts).
      - framework: ../build/XCFrameworks/debug/Voidbind.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Assemble Voidbind.xcframework (KMP)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$PROJECT_DIR/.."
          if [ ! -d "build/XCFrameworks/debug/Voidbind.xcframework" ]; then
            ./gradlew assembleVoidbindDebugXCFramework
          fi
