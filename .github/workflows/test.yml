name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # JVM tests (the pure domain + the software Ed25519 engine) and the Android
  # library compile. ubuntu-latest ships the Android SDK, so the StrongBox-sealed
  # `actual` is type-checked against the real android.security.keystore APIs here.
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: gradle jvmTest + android compile
        run: ./gradlew jvmTest compileReleaseKotlinAndroid --no-daemon --stacktrace

  # voidbind-go is the single source of truth for the protocol golden vectors
  # (its `testvectors` package). The copies under src/jvmTest/resources/vectors/
  # must match voidbind-go's testvectors/vectors/ byte-for-byte at the commit
  # pinned in VOIDBIND_GO_REF, so a hand-edit or a stale copy fails here rather
  # than letting the port silently agree with itself. Plain git (no extra
  # action to pin); voidbind-go is private, so it reads with the org PAT.
  vector-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: diff vectors against voidbind-go at the pinned ref
        env:
          VOIDBIND_GO_TOKEN: ${{ secrets.AUTOLAND_PAT }}
        run: |
          if [ -z "$VOIDBIND_GO_TOKEN" ]; then
            # Fork PRs get no secrets and cannot read the private voidbind-go;
            # the check still runs on every same-repo PR and on push to main.
            echo "::warning::no voidbind-go token (fork PR?); skipping the vector drift check"
            exit 0
          fi
          scripts/check-vector-drift.sh

  # The first-party Android authenticator app (Compose UI). Device behaviour
  # (StrongBox non-extractability, biometric gating) is device-tested per
  # docs/DEVICE-TESTING.md, not here — this job proves the app module compiles and
  # assembles, so a broken UI/build cannot merge. ubuntu-latest ships the Android SDK.
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: gradle assemble app (debug) + pure-JVM unit tests
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest --no-daemon --stacktrace

  # The Secure-Enclave `actual` is Kotlin/Native; only a macOS runner has the
  # toolchain that compiles the iOS targets.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # iosSimulatorArm64Test is deliberately NOT run yet: 7 commonTest cases assert
      # Ed25519 signatures byte-for-byte against Go vectors, and CryptoKit signs
      # with randomized (hedged) Ed25519, so they can never match on Apple. Enable
      # it once those tests assert verify() rather than signature bytes.
      - name: gradle iOS compile
        run: >-
          ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64
          --no-daemon --stacktrace
